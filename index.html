["複","N2","PHỨC","phức hợp, lặp","フク","—",14,"Áo 衤 + trở lại 复","Nhiều lớp áo lặp lại tạo nên sự phức hợp.","複雑","ふくざつ","phức tạp"],
["務","N2","VỤ","nhiệm vụ, phục vụ","ム","つとめる",11,"Mâu 矛 + sức 力","Dồn sức hoàn thành việc được giao là làm nhiệm vụ.","義務","ぎむ","nghĩa vụ"],
["鑑","N1","GIÁM","soi xét, giám định","カン","かんがみる",23,"Kim 金 + giám 監","Dùng tấm gương kim loại để soi xét thật kỹ.","鑑賞","かんしょう","thưởng thức nghệ thuật"],
["顕","N1","HIỂN","hiện rõ, nổi bật","ケン","あらわれる",18,"Hiện 显 + đầu 頁","Điều hiện lên trước mắt trở nên rõ ràng, nổi bật.","顕著","けんちょ","rõ rệt"],
["衡","N1","HÀNH","cân bằng","コウ","—",16,"Bước đi 行 + cân đo","Đi giữa hai phía, giữ chiếc cân luôn thăng bằng.","均衡","きんこう","sự cân bằng"],
["遂","N1","TOẠI","hoàn thành","スイ","とげる",12,"Tiến tới + đường 辶","Đi đến tận cuối con đường để hoàn thành mục tiêu.","遂行","すいこう","thực hiện"],
["懸","N1","HUYỀN","treo, lo lắng","ケン","かける",20,"Treo 縣 + tim 心","Trái tim như bị treo lên vì một điều còn canh cánh.","懸念","けねん","mối lo ngại"]];
const V=[["切磋琢磨","せっさたくま","cùng nhau rèn luyện, tiến bộ","N1","Thành ngữ"],["臨機応変","りんきおうへん","tùy cơ ứng biến","N1","Công việc"],["持続可能","じぞくかのう","có tính bền vững","N2","Xã hội"],["取り組む","とりくむ","bắt tay, nỗ lực giải quyết","N2","Động từ"],["影響","えいきょう","ảnh hưởng","N3","Danh từ"],["間に合う","まにあう","kịp giờ","N4","Đời sống"],["大丈夫","だいじょうぶ","ổn, không sao","N5","Giao tiếp"],["一生懸命","いっしょうけんめい","hết sức, chăm chỉ","N3","Trạng từ"]];
const G=[["〜にほかならない","không gì khác ngoài…","N1","成功は努力の結果にほかならない。"],["〜を皮切りに","bắt đầu từ… rồi lan rộng","N1","東京を皮切りに全国で公演する。"],["〜に伴って","cùng với, kéo theo…","N2","人口の増加に伴って問題も増えた。"],["〜わけではない","không hẳn là…","N2","嫌いなわけではない。"],["〜ことになっている","được quy định, được sắp xếp là…","N3","来月、日本へ行くことになっている。"],["〜ながら","vừa… vừa…","N4","音楽を聞きながら勉強します。"],["〜てもいい","được phép…","N5","ここに座ってもいいです。"]];
const R={N5:["Khởi động","Nền tảng giao tiếp và 80 chữ cốt lõi","#57c6a7"],N4:["Tạo đà","Mở rộng đời sống và hội thoại","#81b5eb"],N3:["Bứt phá","Đọc hiểu tình huống thực tế","#e8b85d"],N2:["Chuyên sâu","Học thuật, tin tức và công việc","#ef8a70"],N1:["Tinh thông","Sắc thái trừu tượng và biểu đạt cao cấp","#c394e8"]};
let tab="kanji",level="Tất cả",selected=K[0],flipped=false,answer=null,learned=JSON.parse(localStorage.getItem("kanmori-learned")||"[]");
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem("kanmori-learned",JSON.stringify(learned));$("#learnedCount").textContent=learned.length+" chữ đã ghi nhớ"}
function setTab(t){tab=t;$$("[data-tab]").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));render()}
function matches(k,q){return (k.join(" ").toLowerCase()).includes(q.toLowerCase())}
function hero(){return `<section class="hero"><div><span class="eyebrow">今日の一字 · CHỮ HÔM NAY</span><h1>Mỗi nét một<br><em>câu chuyện.</em></h1><p>Học Kanji bằng chiết tự trực quan, ví dụ đời thật và nhịp ôn tập vừa đủ mỗi ngày.</p><div class="actions"><button class="primary" onclick="openFlash()">Bắt đầu ôn tập <span>→</span></button><span class="progress"><i><b style="width:${Math.min(100,learned.length*12)}%"></b></i>${learned.length}/8 hôm nay</span></div></div><button class="today" onclick="pick('鑑')"><span class="seal">N1</span><strong>鑑</strong><b>GIÁM · soi xét</b><small>金 + 監</small></button></section>`}
function renderKanji(){let q=$("#searchInput").value.trim(),items=K.filter(k=>(level==="Tất cả"||k[1]===level)&&(!q||matches(k,q)));return hero()+`<div class="section-head"><div><span>KHO HÁN TỰ</span><h2>Khám phá theo trình độ</h2></div><small>${items.length} bài đang hiển thị</small></div><div class="levels">${["Tất cả","N5","N4","N3","N2","N1"].map(x=>`<button class="${level===x?"on":""}" onclick="setLevel('${x}')">${x}<span>${x==="Tất cả"?"∞":K.filter(k=>k[1]===x).length}</span></button>`).join("")}</div>${items.length?`<div class="grid">${items.map(k=>`<button class="card ${selected[0]===k[0]?"sel":""}" onclick="pick('${k[0]}')"><span class="badge">${k[1]}</span><span class="learn">${learned.includes(k[0])?"✓":"＋"}</span><strong>${k[0]}</strong><b>${k[2]}</b><small>${k[3]}</small><em>${k[6]} nét</em></button>`).join("")}</div>`:`<div class="empty"><strong>空</strong><h3>Chưa tìm thấy chữ phù hợp</h3><p>Thử từ khóa khác hoặc chọn tất cả cấp độ.</p></div>`}
function renderVocab(){let q=$("#searchInput").value.trim();return `<section class="page"><span class="eyebrow">語彙 · TỪ VỰNG</span><h1>Gặp từ trong <em>ngữ cảnh thật.</em></h1><p class="page-intro">Từ cơ bản đến biểu đạt N1, mỗi mục đều có cách đọc và nhóm chủ đề để bạn học theo cụm.</p><div class="vocab">${V.filter(v=>!q||v.join(" ").toLowerCase().includes(q.toLowerCase())).map(v=>`<article class="v-card"><span class="pill">${v[3]}</span><span class="pill soft">${v[4]}</span><h3>${v[0]}</h3><b>${v[1]}</b><p>${v[2]}</p><button onclick="openFlash()">Thêm vào bộ ôn <span>＋</span></button></article>`).join("")}</div></section>`}
function renderGrammar(){return `<section class="page"><span class="eyebrow">文法 · NGỮ PHÁP</span><h1>Hiểu cấu trúc,<br><em>dùng tự nhiên.</em></h1><p class="page-intro">Kho ngữ pháp mở xuyên suốt N5–N1, trình bày ngắn gọn bằng ví dụ dễ nhớ.</p><div class="grammar">${G.map((g,i)=>`<article class="g-row"><span class="num">${String(i+1).padStart(2,"0")}</span><div><span class="pill">${g[2]}</span><h3>${g[0]}</h3><p>${g[1]}</p></div><blockquote>${g[3]}</blockquote></article>`).join("")}</div></section>`}
function renderRoad(){return `<section class="page"><span class="eyebrow">道 · LỘ TRÌNH</span><h1>Một con đường,<br><em>năm cột mốc.</em></h1><p class="page-intro">Không có bài học bị khóa. Bạn có thể bắt đầu ở đúng cấp độ mình cần và quay lại bất cứ lúc nào.</p><div class="road">${Object.keys(R).map((n,i)=>`<article style="--a:${R[n][2]}"><div class="road-num">${i+1}</div><div><span>${n} · ${R[n][0]}</span><h3>${R[n][1]}</h3><p>${K.filter(k=>k[1]===n).length} bài tuyển chọn · Kanji · Từ vựng · Ngữ pháp</p></div><button onclick="level='${n}';setTab('kanji')">Học ngay →</button></article>`).join("")}</div></section>`}
function renderDetail(){let k=selected,choices=[k[3],...K.filter(x=>x[0]!==k[0]).slice(0,3).map(x=>x[3])].sort();$("#detail").innerHTML=`<div class="detail-head"><span>CHI TIẾT HÁN TỰ</span><button>•••</button></div><section class="detail-box"><div class="detail-main"><span class="badge">${k[1]}</span><strong>${k[0]}</strong><b>${k[2]}</b><p>${k[3]}</p></div><div class="reading"><div><span class="label">ÂM ON</span><b>${k[4]}</b></div><div><span class="label">ÂM KUN</span><b>${k[5]}</b></div></div><div class="parts"><span class="label">CHIẾT TỰ</span><b>${k[7]}</b><p>“${k[8]}”</p></div><div class="example"><span class="label">TỪ VÍ DỤ</span><div class="word"><strong>${k[9]}</strong><p>${k[10]}<br><b>${k[11]}</b></p></div></div><button class="learn-btn ${learned.includes(k[0])?"done":""}" onclick="toggleLearn()">${learned.includes(k[0])?"✓ Đã ghi nhớ":"＋ Đánh dấu đã học"}</button></section><section class="quiz"><span class="eyebrow">THỬ NHANH</span><h3>“${k[0]}” có nghĩa là gì?</h3><div class="options">${choices.map(c=>`<button class="${answer===c?(c===k[3]?"good":"bad"):""}" onclick="quiz('${c.replaceAll("'","\\'")}')">${c}</button>`).join("")}</div>${answer?`<p class="feedback ${answer===k[3]?"ok":""}">${answer===k[3]?"Chính xác! よくできました。":"Chưa đúng — đáp án là “"+k[3]+"”."}</p>`:""}</section>`}
function render(){let c=tab==="kanji"?renderKanji():tab==="vocab"?renderVocab():tab==="grammar"?renderGrammar():renderRoad();$("#content").innerHTML=c;renderDetail();save()}
function setLevel(x){level=x;render()}function pick(ch){selected=K.find(k=>k[0]===ch);answer=null;if(ch==="鑑")level="N1";render()}function toggleLearn(){let ch=selected[0];learned=learned.includes(ch)?learned.filter(x=>x!==ch):[...learned,ch];render();renderFlash()}function quiz(x){answer=x;renderDetail()}
function openFlash(){flipped=false;$("#modal").classList.add("show");renderFlash()}function renderFlash(){let k=selected;$("#flashLevel").textContent=k[1]+" · Ôn tập tự do";$("#flashCard").classList.toggle("back",flipped);$("#flashCard").innerHTML=!flipped?`<small>CHẠM ĐỂ LẬT</small><strong>${k[0]}</strong><span>${k[6]} nét</span>`:`<small>${k[2]}</small><strong>${k[3]}</strong><span>${k[4]} · ${k[5]}</span><p>${k[9]} · ${k[11]}</p>`;$("#flashLearn").textContent=learned.includes(k[0])?"Đã nhớ ✓":"Đánh dấu đã nhớ"}
$$("[data-tab]").forEach(b=>b.addEventListener("click",()=>setTab(b.dataset.tab)));$("#openFlash").onclick=openFlash;$("#openN1").onclick=()=>{level="N1";setTab("kanji")};$("#searchInput").oninput=render;$("#closeFlash").onclick=()=>$("#modal").classList.remove("show");$("#modal").onclick=e=>{if(e.target.id==="modal")$("#modal").classList.remove("show")};$("#flashCard").onclick=()=>{flipped=!flipped;renderFlash()};$("#flashLearn").onclick=toggleLearn;$("#nextFlash").onclick=()=>{selected=K[(K.indexOf(selected)+1)%K.length];flipped=false;answer=null;render();renderFlash()};document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#searchInput").focus()}if(e.key==="Escape")$("#modal").classList.remove("show")});render();
</script>
</body>
</html>
